services:
  v8std-mcp:
    container_name: v8std-mcp
    image: malikovpro/v8std-mcp:latest
    build:
      context: ..
      dockerfile: docker-compose-mcp-only/docker/Dockerfile.mcp
    restart: always
    ports:
      - "${V8STD_MCP_BIND:-127.0.0.1}:8765:8765"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      V8STD_MCP_GENERATE_INDEX: auto
      V8STD_MCP_HOST: 0.0.0.0
      V8STD_MCP_PORT: "8765"
      V8STD_MCP_ALLOWED_HOSTS: "${V8STD_MCP_ALLOWED_HOSTS:-}"
      V8STD_MCP_ALLOWED_ORIGINS: "${V8STD_MCP_ALLOWED_ORIGINS:-}"
