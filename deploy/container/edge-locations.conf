# Include in the separately inventoried ai.v8std.ru TLS server; do not replace
# default vhosts, certificate configuration or renewal during release.
location = /mcp {
    if ($request_method !~ ^(POST|HEAD)$) { return 405; }
    limit_conn v8std_active 8;
    limit_conn_status 429;
    client_max_body_size 2m;
    client_body_timeout 10s;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_pass http://v8std_release_runtime;
    proxy_intercept_errors on;
    error_page 429 = @v8std_busy;
    error_page 502 503 504 = @v8std_unavailable;
    add_header Allow "POST, HEAD" always;
}
location = /healthz {
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_pass http://v8std_release_runtime;
}
location = /version {
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_pass http://v8std_release_runtime;
}
location ~ "^/indexes/v1/([0-9a-f]{64})/snapshot[.]tar[.]gz$" {
    alias /srv/v8std-indexes/v1/$1/snapshot.tar.gz;
    limit_except GET { deny all; }
    autoindex off;
    types { }
    default_type application/gzip;
    gzip off;
    etag on;
    sendfile on;
    limit_conn v8std_downloads 2;
    limit_conn_status 429;
    limit_rate 1m;
    send_timeout 10s;
    # Never use 'always': 403/404/429 must not acquire immutable caching.
    add_header Cache-Control "public, max-age=31536000, immutable";
    error_page 429 = @v8std_busy;
}
location /indexes/ { return 404; }
location @v8std_busy {
    add_header Retry-After 1 always;
    return 429;
}
location @v8std_unavailable {
    add_header Retry-After 1 always;
    return 503;
}
