# Include once in nginx http{}. Conservative LOCAL TEST starting values only;
# activation requires the recorded native shared-host mixed-load gate.
limit_conn_zone $server_name zone=v8std_active:1m;
limit_conn_zone $server_name zone=v8std_downloads:1m;
upstream v8std_release_runtime {
    zone v8std_release_runtime 64k;
    include /etc/nginx/v8std-release/upstream.conf;
    keepalive 2;
}
