worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Optional MCP HTTP profile, reached only through the published loopback port.
    # Deferred DNS permits a site-only launch with no MCP container.
    server {
        listen 8001;
        resolver 127.0.0.11 valid=10s ipv6=off;
        location / {
            set $mcp_backend mcp:8000;
            proxy_pass http://$mcp_backend;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 65s;
            client_max_body_size 512k;
        }
    }
    server {
        listen 8000;
        server_name _;
        root /srv/site;
        index index.html;
        autoindex off;
        # Match under any operator-selected site prefix. Never cache a pointer
        # based on normalized mtimes, or a 404 for an immutable object.
        location ~ /ai/mcp/v1/manifest\.json$ {
            etag off;
            if_modified_since off;
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }
        location ~ "/ai/mcp/v1/[0-9a-f]{64}/snapshot\.tar\.gz$" {
            types { application/gzip gz; }
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ =404; }
    }
}
