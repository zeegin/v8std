# Docker mcp-registry source schema (pkg/servers/types.go), NOT a submitted entry.
# Release publication replaces release-pending and RELEASE_SOURCE_SHA with the
# verified multi-platform index digest and its matching source commit.
name: v8std
image: ghcr.io/zeegin/v8std-mcp:release-pending
type: server
longLived: true
meta:
  category: developer-tools
  tags: [1c, standards]
about:
  title: V8std
  description: Read-only 1C standards, diagnostics and snippet guidance.
  icon: https://v8std.ru/assets/images/icon-192.png
source:
  project: https://github.com/zeegin/v8std
  commit: RELEASE_SOURCE_SHA
  dockerfile: Dockerfile.mcp
run:
  user: "10001:10001"
  command: [--transport, stdio]
  env:
    V8STD_MCP_SITE_URL: '{{v8std.site_url}}'
    V8STD_MCP_MAX_SNIPPET_CHARS: '{{v8std.max_snippet_chars}}'
  volumes: ['{{v8std.cache_volume}}:/var/lib/v8std-mcp']
config:
  description: Snapshot source, response links and persistent verified cache.
  parameters:
    type: object
    properties:
      site_url:
        type: string
        default: https://v8std.ru/
      max_snippet_chars:
        type: integer
        description: Inclusive range 4000 to 32000 characters; validated by runtime.
        default: 4000
      cache_volume:
        type: string
        default: v8std-mcp-cache
    required: [site_url, max_snippet_chars, cache_volume]
