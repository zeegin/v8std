# Include this server block from the nginx `http` context after installing
# the certificate paths for ai.v8std.ru.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.v8std.ru;

    # Replace these paths with the managed certificate paths on the host.
    ssl_certificate /etc/letsencrypt/live/ai.v8std.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.v8std.ru/privkey.pem;

    access_log /var/log/nginx/ai.v8std.ru.access.log v8std_mcp_timing;
    add_header Retry-After $v8std_retry_after always;

    location = /healthz {
        proxy_pass http://v8std_mcp_upstream/healthz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
    }

    location = /version {
        proxy_pass http://v8std_mcp_upstream/version;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
    }

    location = /mcp/ {
        if ($request_method ~ ^(GET|HEAD)$) {
            return 303 /mcp;
        }
        return 308 /mcp;
    }

    location = /mcp {
        # Reject the optional unsolicited SSE stream at the edge. The ASGI
        # application repeats this check as defense in depth.
        if ($v8std_reject_event_stream_get) {
            return 405;
        }
        add_header Allow "POST, HEAD" always;
        add_header Retry-After $v8std_retry_after always;

        client_max_body_size 256k;
        limit_req zone=v8std_mcp_requests burst=400 nodelay;
        limit_req_status 429;
        limit_conn v8std_mcp_connections 40000;
        limit_conn_status 503;

        # POST responses are request-scoped. A stalled request must not hold
        # an edge worker forever, while normal agent tool calls finish well
        # inside this deadline.
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 35s;
        proxy_next_upstream off;
        proxy_intercept_errors on;
        error_page 502 504 =503 @v8std_mcp_backend_unavailable;
        proxy_pass http://v8std_mcp_upstream/mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location @v8std_mcp_backend_unavailable {
        default_type application/json;
        add_header Retry-After $v8std_retry_after always;
        return 503 '{"error":"MCP backend temporarily unavailable; retry the request."}';
    }

    location = / {
        return 301 https://v8std.ru/mcp/;
    }

    location / {
        return 404;
    }
}
