# Include this file from the nginx `http` context.
#
# The MCP application is stateless. Keep client connections at the edge, but
# use a small reusable upstream pool so idle agents do not consume one Python
# socket each.

worker_rlimit_nofile 131072;

limit_req_zone $binary_remote_addr zone=v8std_mcp_requests:10m rate=100r/s;
limit_conn_zone $server_name zone=v8std_mcp_connections:10m;

map $status $v8std_retry_after {
    default "";
    429 2;
    503 5;
}

map "$request_method:$http_accept" $v8std_reject_event_stream_get {
    default 0;
    ~^GET:.*text/event-stream 1;
}

upstream v8std_mcp_upstream {
    server 127.0.0.1:8765 max_conns=2048;
    keepalive 256;
}
