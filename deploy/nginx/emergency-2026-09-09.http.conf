# Emergency SSE admission policy; include in the nginx http context.
# Deploy as /etc/nginx/conf.d/v8std-mcp-emergency.conf with the incident patch.
map "$request_method:$http_accept" $v8std_emergency_sse_get {
    default 0;
    ~*^GET:.*text/event-stream 1;
}

map $status $v8std_emergency_allow {
    default "";
    405 "POST, HEAD";
}

map $status $v8std_emergency_retry_after {
    default "";
    429 2;
    503 5;
}
